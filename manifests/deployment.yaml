apiVersion: apps/v1
kind: Deployment
metadata:
  name: invitation-paper
  namespace: invitation-paper
  labels:
    app: invitation-paper
spec:
  replicas: 2
  selector:
    matchLabels:
      app: invitation-paper
  template:
    metadata:
      labels:
        app: invitation-paper
    spec:
      imagePullSecrets:
        - name: invitation-paper-registry
      containers:
        - name: invitation-paper
          image: 10.20.20.48:5000/invitation-paper:__IMAGE_TAG__
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
